<main class="shop-shell">
  <header class="shop-header reveal">
    <h1 class="shop-title">SHOP</h1>
  </header>

  <section class="shop-section shop-itsb reveal" aria-labelledby="itsb-heading">
    <h2 class="shop-section-title" id="itsb-heading">IN THE SPACE BETWEEN</h2>
    <div class="shop-bundle">
      <picture>
        <source media="(max-width: 600px)" srcset="assets/artwork/ITSB_BUNDLE_VERTICAL.jpg">
        <img class="shop-lightbox-image" src="assets/artwork/ITSB_BUNDLE.png" alt="In the Space Between vinyl and T-shirt bundle" tabindex="0" role="button" aria-haspopup="dialog">
      </picture>
    </div>

    <div class="shop-bundle-label">
      <h3 class="shop-entry-title">VINYL + T-SHIRT</h3>
      <p class="shop-entry-meta">Coming 2027</p>
    </div>

    <div class="shop-product-grid">
      <article class="shop-entry shop-entry--product">
        <h3 class="shop-entry-title">12&quot; VINYL</h3>
        <p class="shop-entry-meta">Coming 2027</p>
        <img class="shop-product-image shop-product-image--vinyl shop-lightbox-image" src="assets/artwork/ITSB_VINYL_2.png" alt="In the Space Between vinyl" tabindex="0" role="button" aria-haspopup="dialog">
      </article>

      <article class="shop-entry shop-entry--product">
        <h3 class="shop-entry-title">T-SHIRT</h3>
        <p class="shop-entry-meta">Coming 2027</p>
        <div class="shop-shirt-images">
          <img class="shop-lightbox-image" src="assets/artwork/ITSB_TSHIRT_FRONT.jpg" alt="In the Space Between T-shirt front" tabindex="0" role="button" aria-haspopup="dialog">
          <img class="shop-lightbox-image" src="assets/artwork/ITSB_TSHIRT_BACK.jpg" alt="In the Space Between T-shirt back" tabindex="0" role="button" aria-haspopup="dialog">
        </div>
      </article>
    </div>
  </section>

  <section class="shop-section shop-trim reveal" aria-labelledby="trim-heading">
    <h2 class="shop-section-title" id="trim-heading">TRIM THE THREAD</h2>
    <article class="shop-entry shop-entry--digital">
      <p class="shop-entry-meta">Digital EP</p>
      <a class="shop-release-art-link" href="https://quietruin.bandcamp.com/album/trim-the-thread" target="_blank" rel="noopener">
        <img class="shop-release-art" src="assets/artwork/trim-the-thread.png" alt="Trim the Thread artwork">
      </a>
      <a class="shop-link" href="https://quietruin.bandcamp.com/album/trim-the-thread" target="_blank" rel="noopener">Available via Bandcamp</a>
    </article>
  </section>
